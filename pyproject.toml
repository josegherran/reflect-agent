[project]
name = "reflect-agent"

version = "0.1.0"
description = "A Python multi-agent AI project for guiding AI prompt creation and evaluation using the ReFlect framework."
authors = [
    { name="Jose G. Herran", email="josegherran@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "strands-agents>=0.1.0,<2.0.0",
    "strands-agents-tools>=0.1.0,<2.0.0",
    "strands-agents-builder>=0.1.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "prometheus-client>=0.21.0,<1.0.0",
    "anthropic>=0.40.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent", "ui", "config"]
omit = ["*/__pycache__/*", "*/test_*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["agent", "ui"]
exclude = ["references*"]

# Ruff configuration
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# Mypy configuration
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
